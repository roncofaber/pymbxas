[metadata]
name = pymbxas
version = attr:pymbxas.__version__
author = Fabrice Roncoroni
author_email = roncoroni@lbl.gov
url = https://github.com/roncofaber/pymbxas
description = PyMBXAS is a package for setting up, manipulating, running and visualizing MBXAS calculations using Python.
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files =
    LICENSE
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Topic :: Software Development
    Topic :: Scientific/Engineering

[options]
python_requires = >=3.9
packages = find:
install_requires =
    pyscf>=2.6.2
    ase>=3.23.0
    h5py
    psutil
    numpy
    scipy
    scikit-learn

[options.entry_points]
console_scripts =
    mbxas = pymbxas.cli.pyscf:main

[options.extras_require]
ml =
    gpflow
    tensorflow
gpu =
    gpu4pyscf
plot =
    matplotlib
test =
    pytest
